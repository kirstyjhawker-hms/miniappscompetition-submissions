builder_story: "I built VeriLock after seeing how rental and freelance
  agreements get disputed months later - with no easy way to prove everyone
  signed the same document. Existing e-sign tools store your PDFs on their
  servers and charge monthly fees. VeriLock takes a different
  approach:  fingerprint the document locally, collect wallet-backed signatures
  from each party, and anchor the final hash on the Nimiq blockchain with a
  single fingerprint transaction. The file stays on your device, but the proof
  is permanent and publicly verifiable. I also created
  https://github.com/clevertech-os/verilock-offline so that if users decide to
  store their completed fields - signatures, text, they can recompile the
  contract using the original document.\r

  I used Grok to ship the full stack - React\r

  \  mini app, Express API, SQLite on Railway - in time for the competition."
