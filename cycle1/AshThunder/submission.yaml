builder_story: "Crypto events still run on PDF tickets and screenshot QR codes
  that anyone can copy. I wanted something that feels natural inside a payment
  wallet: create an event, pay in NIM, show a rotating QR at the door, and leave
  with proof you showed up.\r

  \r

  GatePass is that loop. Hosts sell tickets in Nimiq Pay. Guests pay with NIM.
  Door staff scan a time-based QR that is hard to fake. After the event,
  checked-in guests get a proof of attendance badge.\r

  \r

  Built for meetups, workshops, and community nights where you need tickets that
  work as well as the money that bought them."
