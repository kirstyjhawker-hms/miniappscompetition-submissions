app_name: sFace
category: Games
tagline: Crypto is down. Somebody has to save face.
description: "Each day the worst performer in the top 100 becomes a playable
  level: its real a 24-hour chart is the terrain, and the people trapped in it
  are whoever crypto X spent that day arguing about. It is for anyone who
  follows the market and would rather play the news than ignore it."
