builder_story: "A tally stick was how debt worked before contracts. Notches cut
  across a piece of wood, then split lengthwise so each party kept a matching
  half, and neither could shave a notch without the other's half exposing it. I
  wanted the same property: a shared record neither side can quietly edit. The
  chain provides the notches. Nimiq being feeless is what makes it possible to
  settle the tab in amounts small enough that people actually bother."
