builder_story: "I've spent the last two and a half years in Web3, five-plus
  hackathons, some at big-stakes, reputable events, with recognition from major
  chains along the way. But after all those projects and hours, I hit a wall: I
  had no credible proof of what I'd actually executed. Nothing that said, with a
  straight face, \"this is mine ( and yes I lost my previous startup on which i
  spent a year of my life on because of this ), and here's the discipline behind
  it.\"\r

  \r

  Two things I've always been bad at: shipping consistently, and keeping up with
  daily habits like fitness. What I realized is that commitment only sticks when
  something real is on the line. That's the idea behind Pods, put NIM behind the
  activity, and let the stake do the work your willpower won't.\r

  \r

  This submission is a starting point, not the ceiling. We're staying narrow on
  purpose: a community of builders and shippers first, with a clean enough
  integration surface that we think even student and campus communities will
  want to adopt it later. The direction we're building toward is an execution
  profile, not just a builder profile, every commitment and every piece of proof
  logged, so no one can take credit for your work but you, and your discipline
  is visible, not just claimed. From there, we want to plug into event
  organizers and hackathons directly, for individuals and teams. And for solo
  builders and small teams, the ones who ship hard and forget to tell anyone we
  want Pods to carry their project's visibility and timeline, so they can stay
  heads-down on the build instead of managing the socials."
