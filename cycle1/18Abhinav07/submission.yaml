tagline: Commit, Show-up, Earn Repeat. Make showing up feel real.
description: Pods is a NIM-backed accountability app for small groups on Nimiq
  Pay, commit NIM upfront, submit proof for scheduled activities like shipping
  code, fitness, reading or study, and get payouts proportional to your
  presence. Commit, Show-up, Earn, Repeat.
