app_name: Rota
category: Earning
tagline: Save together, get paid in turn -  no treasurer required
description: Rota brings ajo, esusu, and tanda rotating savings circles
  on-chain. Each round, members pay each other directly — Rota never holds the
  pot. Turn order is fixed or price-bid, never random, and a portable Trust
  Score tracks who pays on time across circles.
