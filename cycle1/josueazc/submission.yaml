builder_story: "I've always been passionate about video games, especially arcade
  and casual games that you can pick up and enjoy anytime on your phone. Growing
  up, I spent countless hours playing simple but addictive games, and they
  inspired me to start building games of my own.\r

  \r

  This project is my way of combining that passion with the Nimiq ecosystem. I
  want to create a collection of fun, polished, and highly replayable mini-games
  that people genuinely enjoy, while also bringing more users and engagement to
  the Nimiq community. My goal is to make something that players come back to
  because it's entertaining, not just because it's part of a Web3 application.\r

  \r

  I believe games are one of the best ways to introduce people to new
  technologies in a natural and enjoyable way. If someone discovers Nimiq
  because they had fun playing these games, then the project has already
  achieved something meaningful. Building experiences that people enjoy while
  helping grow the community is what motivates me the most."
