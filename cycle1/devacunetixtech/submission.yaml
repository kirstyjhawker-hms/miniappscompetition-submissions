builder_story: "I'm a full-stack developer passionate about building products
  that solve real-world problems through Web3. While attending community events
  and hackathons, I noticed organisers often struggle to reward participation
  fairly, securely, and at scale. Existing solutions are fragmented, manual, or
  focused only on token distribution.\r

  \r

  I built RallyNIM to make community engagement effortless. Organisers can
  launch smart reward campaigns in minutes, while participants simply connect
  their MiniPay wallet, complete activities, scan dynamic QR codes, and
  instantly earn NIM rewards.\r

  \r

  Throughout this competition, I built in public, gathered feedback from the
  community, and focused on delivering a polished, production-ready Mini App
  rather than just a prototype. My goal is to help make MiniPay the go-to
  platform for rewarding real-world participation and community engagement."
