builder_story: "I'm Chukwuemeka, the \"student paramedic who codes.\"\r

  \r

  In emergency medicine, consistency isn't optional. You don't get to skip the
  protocol because you're not feeling it. But outside the clinical world? I
  struggle with the same habit consistency everyone does. Rotations eat my
  schedule, and the first thing to slip is always the habit I actually care
  about.\r

  \r

  Every streak app I've tried relies on motivation showing up when you need it.
  It rarely does.\r

  \r

  So I built SteadyStreak: put real NIM behind your streak. Break it, you lose
  your stake. Finish it, you split the pool with everyone else who stayed
  consistent. It's the same principle paramedics live by; show up every time,
  not just when you feel like it, just applied to daily habits instead of
  emergencies.\r

  \r

  Built solo on Nimiq Pay's Mini App Framework for Cycle I of the competition.
  v1 is live. More coming."
