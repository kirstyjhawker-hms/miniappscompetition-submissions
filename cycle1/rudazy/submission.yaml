builder_story: "We all have that one friend who \"definitely\" pays you back
  Friday, then Friday becomes next week, and bringing it up makes you the
  awkward one. So you just eat it and keep score in your head.\r

  \r

  Pact fixes that. It's a Mini App inside Nimiq Pay where money between friends
  carries weight. Instead of tracking who owes what after the fact, you put
  something on the line before it happens. Lock real NIM behind a promise, keep
  it and your stake returns, break it and it goes to the group. Pool a shared
  vault the whole Circle controls. Settle challenges head to head where the
  winner takes the pot.\r

  \r

  It's not a bill splitter. It's accountability you can actually feel, built for
  the people who already trust each other."
