builder_story: "I grew up on internet forums, the ability to communicate with
  others around the world over a common subject has been lost. I kind of miss
  this.\r

  \r

  Chat apps like Telegram & Discord miss the mark, as it feels impersonal.
  Non-English speaking users are confined to their own single language only
  channels & there is rarely any cross communication between.\r

  \r

  Nimiq Space fits a niche where users can see each other occupying a shared
  (Nimiq) space, indicating to others that \"I'm here right now\" which is
  encouraging for real life asyncronous communication. Accessibility features
  were implemented to allow for quick translating between languages.\r

  \r

  Nimiq here is the common connection, any active users silently share this
  connection & can quickly socialize with others. There's a long way to go, but
  we've only just planted the seeds :)"
