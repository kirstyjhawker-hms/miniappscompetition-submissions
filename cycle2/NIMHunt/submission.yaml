builder_story: "Second time’s the charm! I’m giving this idea another go because
  I still think it’s a great use case for Nimiq. Now new and improved!\r

  \r

  Long, long ago, many of my friends fell in love with another geofaucet app,
  WeNano. None of them were interested in crypto beforehand, but the app gave
  them a fun reason to start using it.\r

  \r

  Nimiq is one of the most user-friendly cryptocurrencies out there, so I wanted
  to create something that could achieve the same effect."
