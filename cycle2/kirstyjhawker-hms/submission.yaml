app_name: Pay It Sideways
category: Social
tagline: Someone showed up for you. Show up for someone else.
description: Pay It Sideways lets you send a private note of appreciation,
  optionally with a claimable NIM gift—without asking for the recipient’s wallet
  address. They can keep it or let it inspire a fresh act of kindness for
  someone else.
pricing: Free
