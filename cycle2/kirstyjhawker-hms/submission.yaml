builder_story: "Crypto gifting normally begins with plumbing: “What is your
  wallet address?” Pay It Sideways begins with the person. I wanted a product
  where a sincere sentence still feels whole at 0 NIM, while a tiny payment can
  add something tangible without becoming a score, status symbol, or social
  debt. The difficult part was making one link preserve the recipient’s choice.
  The resulting addressless bearer gift keeps wallet mechanics quiet, uses real
  NIM, and lets a message reach someone who has never exchanged an address with
  the sender."
