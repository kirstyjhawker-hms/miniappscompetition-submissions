builder_story: "I run QuickQuoteTool.ca, a FedEx shipping rate tool, and kept
  running into the same problem: shipment disputes and \"where's my package\"
  questions that a simple photo at drop-off would have solved instantly. So I
  built QuickProof — a fast way for logistics teams to snap a photo and send it
  straight to email, no app clutter, no friction.\r

  \r

  It's used daily by people with zero interest in crypto, which made adding NIM
  an interesting challenge: how do you bring it into a product without making it
  feel like a \"crypto app\" bolted on? The answer was to keep it quiet. The tip
  jar only shows up at meaningful moments — the first successful shipment, then
  every 10th one after that — and PayPal sits right next to NIM so the feature
  works whether someone's into Nimiq or not. Settings always has both options
  too, for anyone who wants to come back later.\r

  \r

  Building the Mini App as its own open-source repo, separate from QuickProof's
  private codebase, meant thinking through a real integration: actual
  transactions, real UI, a real fallback for people opening it outside Nimiq
  Pay. It's been a good way to see what it actually takes to bring Nimiq into a
  product that already has daily users, not a demo built from scratch."
