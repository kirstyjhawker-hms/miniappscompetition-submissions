tagline: An aquarium that fills from your Nimiq staking.
description: "Reef turns Nimiq staking into a living aquarium: cast a line each
  epoch and pull out one of seventeen species, whose rarity you earn by staking
  steadily rather than heavily. For anyone holding NIM who'd rather watch
  something grow\r

  than watch a number."
