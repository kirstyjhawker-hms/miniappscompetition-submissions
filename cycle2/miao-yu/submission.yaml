builder_story: "I run a Nimiq staking pool, so I've watched what happens after
  somebody\r

  delegates: nothing. The transaction confirms and the experience ends.\r

  \r

  Reef makes the waiting visible - an aquarium that fills from your real
  staking,\r

  one cast per epoch, seventeen species with over a thousand looks each. The
  rule\r

  I care about is that rarity comes from how long you've staked, never how
  much.\r

  Stake size buys room; the rare creatures only come to people who stayed.\r

  \r

  Reef is totally free."
