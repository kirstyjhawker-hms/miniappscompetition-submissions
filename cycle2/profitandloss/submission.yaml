builder_story: "I built BodyDouble because of my own thesis. I wrote The
  Attention Economy\r

  Thesis: ADHD is not a deficit of attention but a different economy of
  attention\r

  — one that pays in interest, novelty, challenge, urgency and meaning instead
  of\r

  importance, priority and consequence. Hyperfocus is the proof: nine hours on
  the\r

  right task, nine minutes of struggle on the wrong one.\r

  \r

  Body doubling is currency conversion in action. Working quietly beside
  someone\r

  converts an importance-denominated task into one with social presence and\r

  urgency — currencies the ADHD mind actually accepts. The stake adds real skin
  in\r

  the game: finish the session, get it back; leave early, it's gone.\r

  \r

  So BodyDouble is my thesis made touchable — a tool that doesn't ask anyone
  to\r

  \"try harder\", it changes the price. Built with AI assistance as a web app on
  the\r

  Nimiq Mini Apps SDK, with USDT-on-Polygon stakes. For the ADHD community,
  for\r

  anyone who struggles to start, and for everyone who works better when
  they're\r

  not alone."
